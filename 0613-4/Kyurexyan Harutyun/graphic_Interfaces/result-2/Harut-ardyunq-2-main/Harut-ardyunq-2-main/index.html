<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ուսումնառության Արդյունք 2</title>
    <!-- Google Fonts - Ժամանակակից տառատեսակ -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="sty.css">
</head>
<body>

    <div class="app-container">
        <!-- Վերնագրի հատված -->
        <header class="app-header">
            <h2>Ուսումնառության Արդյունք 2</h2>
            <p class="subtitle">Գրաֆիկական մենյուների, մկնիկի և ստեղնաշարի հաղորդագրությունների մշակում</p>
        </header>

        <!-- Մենյուի բար -->
        <nav class="nav-bar">
            <ul class="menu-bar">
                <li class="menu-item" id="mainMenuBtn">
                    <button class="menu-btn">
                        <span>📁 Ֆայլ</span>
                        <span class="arrow">▼</span>
                    </button>
                    <ul class="submenu" id="subMenu">
                        <li><a href="#" id="openSub"><span class="icon">📂</span> Բացել</a></li>
                        <li><a href="#" id="exitSub"><span class="icon">🚪</span> Ելք</a></li>
                    </ul>
                </li>
            </ul>
        </nav>

        <!-- Իրադարձությունների մատյան (Log) -->
        <main class="output-card">
            <div class="card-header">
                <span class="dot red"></span>
                <span class="dot yellow"></span>
                <span class="dot green"></span>
                <h3>Իրադարձությունների մատյան (Log)</h3>
            </div>
            <div id="output" class="output-box">
                Սեղմեք մենյուի վրա, կտտացրեք մկնիկով այս տարածքում կամ սեղմեք ստեղնաշարի որևէ ստեղն...
            </div>
        </main>
    </div>

    <script src="js.js"></script>
</body>
</html>
