
<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Գրաֆիկական մենյու</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Գրաֆիկական մենյու</h1>
        <p>Ընտրիր անհրաժեշտ գործողությունը</p>

        <nav>
            <button id="menuBtn">Հիմնական մենյու ▼</button>

            <div id="menu" class="menu">
                <button id="openBtn">Բացել</button>

                <button id="subBtn">Գործիքներ ▸</button>

                <div id="submenu" class="submenu">
                    <button id="infoBtn">Տեղեկություն</button>
                    <button id="clearBtn">Մաքրել</button>
                </div>

                <button id="exitBtn">Ելք</button>
            </div>
        </nav>

        <div class="result" id="result">
            Այստեղ կհայտնվեն հաղորդագրությունները։
        </div>

        <p>Փորձիր նաև օգտագործել ստեղնաշարի սլաքները և Enter կոճակը։</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
