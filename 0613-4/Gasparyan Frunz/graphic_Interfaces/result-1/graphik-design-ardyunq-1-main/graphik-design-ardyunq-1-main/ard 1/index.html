<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Տվյալների մուտքագրում</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Տվյալների մուտքագրում</h1>
        <p>Լրացրեք դաշտերը և ընտրեք համապատասխան տարբերակները։</p>

        <div class="form-group">
            <label>Անուն</label>
            <input type="text" id="name" placeholder="Մուտքագրեք անունը">
        </div>

        <div class="form-group">
            <label>Ազգանուն</label>
            <input type="text" id="surname" placeholder="Մուտքագրեք ազգանունը">
        </div>

        <div class="form-group">
            <label>Ընտրեք մասնագիտությունը</label>
            <select id="profession">
                <option value="">Ընտրեք...</option>
                <option value="Ծրագրավորում">Ծրագրավորում</option>
                <option value="Դիզայն">Դիզայն</option>
                <option value="Ցանցեր">Համակարգչային ցանցեր</option>
            </select>
        </div>

        <div class="form-group">
            <label>Ընտրեք ուսուցման ձևը</label>
            <select id="study">
                <option value="">Ընտրեք...</option>
                <option value="Առկա">Առկա</option>
                <option value="Հեռակա">Հեռակա</option>
            </select>
        </div>

        <button id="sendBtn">Ուղարկել</button>
        <button id="clearBtn" class="clear">Մաքրել</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
