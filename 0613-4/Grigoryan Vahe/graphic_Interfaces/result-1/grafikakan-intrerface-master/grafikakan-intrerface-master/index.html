<!DOCTYPE html>

<html lang="hy">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Հեշտ ծրագրավորում</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<h1>Ֆորմա</h1>
<label for="textInput">Գրեք անուն:</label>
<input type="text" id="textInput" placeholder="Մուտքագրեք ձեր տեքստը">
<button onclick="showText()">ՁԵՐ ՏԵՔՍՏԸ</button>
<p id="textMessage"></p>
<br><br>
<label for="selectInput">Ընտրեք տարբերակը:</label>
<select id="selectInput">
    <option value="Առաջին">Առաջին</option>
    <option value="Երկրորդ">Երկրորդ</option>
    <option value="Երրորդ">Երրորդ</option>
</select>
<button onclick="showSelection()">Ցույց տալ ընտրությունը</button>
<p id="selectionMessage"></p>
<label>
<input type="checkbox" id="myCheckbox">
Accept Terms and Conditions
</label>
<button onclick="showCheckbox()">Ցույց տալ տեսություն</button>
<p id="checkboxMessage"></p>




<script src="script.js">
</script>
</body>
</html>
