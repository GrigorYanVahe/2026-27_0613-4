<body>

    <div class="container">
        <h1>Անձնական Էջ</h1>

        <!-- Տեքստային բաժին -->
        <div class="form-group">
            <label for="textInput">Մուտքագրեք ձեր անունը:</label>
            <input type="text" id="textInput" placeholder="Օր.՝ Աննա Մովսիսյան">
            <button onclick="showText()">Հաստատել անունը</button>
            <p id="textMessage"></p>
        </div>

        <!-- Ընտրության բաժին -->
        <div class="form-group">
            <label for="selectInput">Ընտրեք ձեր քաղաքը:</label>
            <select id="selectInput">
                <option value="Երևան">Երևան</option>
                <option value="Գյումրի">Գյումրի</option>
                <option value="Վանաձոր">Վանաձոր</option>
            </select>
            <button onclick="showSelection()">Հաստատել քաղաքը</button>
            <p id="selectionMessage"></p>
        </div>

        <!-- Checkbox բաժին -->
        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" id="myCheckbox">
                Ստանալ ծանուցումներ էլ. փոստին
            </label>
            <button onclick="showCheckbox()">Ստուգել կարգավորումը</button>
            <p id="checkboxMessage"></p>
        </div>
    </div>

    <!-- Կապում ենք JavaScript ֆայլը -->
    <script src="javascript.js"></script>
</body>
