<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <title>Մեր սրճարանը</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <h2>Գրանցում սրճարանում</h2>

    <label>Անուն</label>
    <input type="text" id="name" placeholder="Մուտքագրեք անունը">

    <label>Հեռախոսահամար</label>
    <input type="tel" id="phone" placeholder="Հեռախոսահամար">

    <label>Այցելության օր</label>
    <input type="date" id="date">

    <label>Այցելուների քանակ</label>
    <select id="people">
        <option value="1">1 անձ</option>
        <option value="2">2 անձ</option>
        <option value="3">3 անձ</option>
        <option value="4">4 անձ</option>
    </select>

    <button onclick="sendData()">Գրանցվել</button>
    <button onclick="clearData()">Մաքրել</button>

    <p id="output"></p>
</main>
<style>
body{
    background-image: url(https://i.pinimg.com/736x/5d/2f/2a/5d2f2aeb28860746c0c2c5299acf2069.jpg) ;
    background-repeat: no-repeat;
    background-size: 100%;  
    font-family: Arial, sans-serif;
    background-color: #f3e5d8;
    margin-left: 200px;
    margin-top: 100px;
    padding: 40px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

main {
    width: 420px;
    padding: 30px;
    background-color: #fffaf5;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(80, 45, 25, 0.15);
}

h2 {
    text-align: center;
    color: #65452f;
    margin-bottom: 25px;
    font-size: 25px;
}

label {
    display: block;
    color: #65452f;
    margin-bottom: 8px;
    margin-top: 16px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d8c0aa;
    border-radius: 6px;
    background-color: #ffffff;
    font-size: 15px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #956b4d;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 18px;
    border: none;
    border-radius: 6px;
    background-color: #795238;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background-color: #593a27;
}

button + button {
    background-color: #d9c1ad;
    color: #503522;
}

button + button:hover {
    background-color: #c5a990;
}

#output {
    text-align: center;
    color: #65452f;
    margin-top: 18px;
    font-weight: bold;
}
</style>
    <script src="quation2.js"></script>
</body>
</html>
