<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Բարի գալուստ</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="welcome-card">
        <p class="eyebrow">Մուտքի էջ</p>
        <h1 id="myH1">Բարի գալուստ</h1>
        <p class="description">Մուտքագրեք Ձեր անունը և հաստատեք, որ մարդ եք։</p>

        <form id="welcomeForm">
            <label for="myInput">Ձեր անունը</label>
            <input
                type="text"
                id="myInput"
                placeholder="Օրինակ՝ Արամ"
                autocomplete="given-name"
            >

            <label class="check-row" for="myCheck">
                <input type="checkbox" id="myCheck">
                <span>Ես ռոբոտ չեմ</span>
            </label>

            <button type="submit" id="myButton">Շարունակել <span>→</span></button>
        </form>

        <p class="note">Խնդրում ենք լրացնել բոլոր դաշտերը։</p>
    </main>
</body>
</html>
