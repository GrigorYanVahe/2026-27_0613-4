<!DOCTYPE html>
<html lang="hy">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Տեքստային դաշտեր</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <h2>Տեքստային դաշտերի կիրառում</h2>

    <label for="name">Մուտքագրեք ձեր անունը՝</label>
    <br><br>

    <input type="text" id="name" placeholder="Ձեր անունը">

    <button onclick="showName()">Ցուցադրել</button>

    <p id="result"></p>

    <h3>Հաստատեք, որ ռոբոտ չեք</h3>

    <input type="checkbox" id="robot">
    <label for="robot">Ես ռոբոտ չեմ</label>

    <br><br>

    <button onclick="checkRobot()">Հաստատել</button>

    <p id="message"></p>


    <button onclick="showColor()"></button>

    <p id="result"></p>


    <input type="text" id="name" value="Վահե">

    <input type="number" id="age" value="17">

    <button onclick="showValues()">Ցուցադրել</button>

    <p id="result"></p>
    <script src="seyran.js"> </script>
    </body>
</html>
