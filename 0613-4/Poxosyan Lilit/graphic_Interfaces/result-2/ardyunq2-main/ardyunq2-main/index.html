<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ուսումնական Մոդուլ 2</title>
    <!-- CSS ֆայլի միացում -->
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <main class="app-wrapper">
        <header class="header-section">
            <h2 class="main-title">Ուսումնառության Արդյունք 2</h2>
            <p class="subtitle">Գրաֆիկական մենյուների, մկնիկի և ստեղնաշարի հաղորդագրությունների մշակում</p>
        </header>

        <!-- Նավիգացիոն մենյու -->
        <nav class="navigation-bar">
            <div class="dropdown-wrapper" id="mainMenuBtn">
                <button type="button" class="menu-btn">
                    <span>Ֆայլ</span>
                    <span class="arrow">▼</span>
                </button>
                <div class="submenu" id="subMenu">
                    <a href="#" class="submenu-item" id="openSub">📂 Բացել</a>
                    <a href="#" class="submenu-item" id="exitSub">🚪 Ելք</a>
                </div>
            </div>
        </nav>

        <!-- Իրադարձությունների արտացոլման բաժին -->
        <section class="log-container">
            <h3 class="log-title">Իրադարձությունների մատյան (Log)</h3>
            <div id="output" class="log-box">
                Սեղմեք մենյուի վրա, կտտացրեք մկնիկով այս տարածքում կամ սեղմեք ստեղնաշարի որևէ ստեղն...
            </div>
        </section>
    </main>

    <!-- JavaScript ֆայլի միացում -->
    <script src="index.js"></script>
</body>
</html>
